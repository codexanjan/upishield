<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="adBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a12"/>
      <stop offset="50%" stop-color="#081020"/>
      <stop offset="100%" stop-color="#0a172e"/>
    </linearGradient>
    <linearGradient id="adCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1d38" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#081224" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="adShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#adBg)"/>

  <!-- Top Command Center Header -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="1120" height="60" rx="14" fill="#09152b" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="28" cy="30" r="14" fill="#38bdf8" fill-opacity="0.2"/>
    <path d="M 28 20 L 36 24 L 36 32 C 36 37 28 41 28 41 C 28 41 20 37 20 32 L 20 24 Z" fill="#38bdf8"/>
    <text x="54" y="36" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="900" font-size="18">UPI SHIELD <tspan fill="#38bdf8">COMMAND CENTER</tspan></text>

    <!-- Live Telemetry Status -->
    <g transform="translate(760, 16)">
      <circle cx="12" cy="14" r="5" fill="#10b981"/>
      <text x="24" y="18" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="700">18,420 Txns / Sec Processed</text>
      <rect x="230" y="0" width="110" height="28" rx="8" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4"/>
      <text x="285" y="18" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">ADMIN V2.4</text>
    </g>
  </g>

  <!-- 3-Column Triage & Intelligence Grid -->
  <g transform="translate(40, 110)">
    <!-- Column 1: Live Case Triage Queue -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="350" height="530" rx="16" fill="url(#adCard)" stroke="#ffffff" stroke-opacity="0.1" filter="url(#adShadow)"/>
      <text x="20" y="34" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800">Case Triage Queue</text>
      <text x="20" y="54" fill="#64748b" font-family="sans-serif" font-size="11">Priority-ranked fraud incidents</text>

      <!-- Case 1 -->
      <g transform="translate(16, 75)">
        <rect x="0" y="0" width="318" height="95" rx="12" fill="#2d0a11" stroke="#ff4757" stroke-opacity="0.4"/>
        <text x="14" y="24" fill="#ff6b81" font-family="sans-serif" font-size="12" font-weight="800">CASE #8492 · CRITICAL</text>
        <text x="14" y="44" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Delhi Rohini Impossible Travel</text>
        <text x="14" y="64" fill="#94a3b8" font-family="sans-serif" font-size="11">Complainant: Anjan K. • ₹18,500</text>
        <rect x="220" y="10" width="86" height="24" rx="6" fill="#ff4757"/>
        <text x="263" y="26" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">FREEZE VPA</text>
      </g>

      <!-- Case 2 -->
      <g transform="translate(16, 185)">
        <rect x="0" y="0" width="318" height="95" rx="12" fill="#1c1917" stroke="#f59e0b" stroke-opacity="0.3"/>
        <text x="14" y="24" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="800">CASE #8491 · HIGH</text>
        <text x="14" y="44" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Rapid Collect Request Sweep</text>
        <text x="14" y="64" fill="#94a3b8" font-family="sans-serif" font-size="11">Merchant: lottery_rewards@upi</text>
        <rect x="220" y="10" width="86" height="24" rx="6" fill="#f59e0b"/>
        <text x="263" y="26" fill="#000000" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">HOLD 48H</text>
      </g>

      <!-- Case 3 -->
      <g transform="translate(16, 295)">
        <rect x="0" y="0" width="318" height="95" rx="12" fill="#0b1728" stroke="#38bdf8" stroke-opacity="0.3"/>
        <text x="14" y="24" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="800">CASE #8490 · MEDIUM</text>
        <text x="14" y="44" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">New SIM Swap Telemetry</text>
        <text x="14" y="64" fill="#94a3b8" font-family="sans-serif" font-size="11">Device IMEI Mismatch</text>
        <rect x="220" y="10" width="86" height="24" rx="6" fill="#38bdf8"/>
        <text x="263" y="26" fill="#000000" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">VERIFY KYC</text>
      </g>

      <!-- Case 4 -->
      <g transform="translate(16, 405)">
        <rect x="0" y="0" width="318" height="95" rx="12" fill="#06121f" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="14" y="24" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="800">CASE #8489 · RESOLVED</text>
        <text x="14" y="44" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Refund Reversal Approved</text>
        <text x="14" y="64" fill="#94a3b8" font-family="sans-serif" font-size="11">Returned ₹4,200 to victim</text>
        <text x="290" y="26" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="end">CLOSED ✓</text>
      </g>
    </g>

    <!-- Column 2: Sybil / Money Mule Network Graph -->
    <g transform="translate(370, 0)">
      <rect x="0" y="0" width="410" height="530" rx="16" fill="url(#adCard)" stroke="#ffffff" stroke-opacity="0.1" filter="url(#adShadow)"/>
      <text x="20" y="34" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800">Mule Syndicate Graph</text>
      <text x="20" y="54" fill="#64748b" font-family="sans-serif" font-size="11">Graph neural network ring identification</text>

      <!-- Network Visualization Area -->
      <g transform="translate(20, 75)">
        <rect x="0" y="0" width="370" height="430" rx="12" fill="#070f1e" stroke="#ffffff" stroke-opacity="0.06"/>
        
        <!-- Graph Links -->
        <g stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4">
          <line x1="185" y1="180" x2="100" y2="90"/>
          <line x1="185" y1="180" x2="270" y2="90"/>
          <line x1="185" y1="180" x2="80" y2="280"/>
          <line x1="185" y1="180" x2="290" y2="270"/>
          <line x1="185" y1="180" x2="185" y2="350"/>
          <!-- Sub-links -->
          <line x1="100" y1="90" x2="270" y2="90" stroke="#ff4757" stroke-width="2" stroke-dasharray="4,4"/>
          <line x1="80" y1="280" x2="185" y2="350"/>
        </g>

        <!-- Central Hub Node (Mule Kingpin) -->
        <g transform="translate(185, 180)">
          <circle cx="0" cy="0" r="28" fill="#ff4757" fill-opacity="0.3"/>
          <circle cx="0" cy="0" r="14" fill="#ff4757"/>
          <text x="0" y="4" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">HUB</text>
          <rect x="-65" y="20" width="130" height="20" rx="4" fill="#000000" fill-opacity="0.8"/>
          <text x="0" y="33" fill="#ff6b81" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">mule_ring_leader@ybl</text>
        </g>

        <!-- Peripheral Nodes -->
        <g transform="translate(100, 90)">
          <circle cx="0" cy="0" r="10" fill="#f59e0b"/>
          <text x="0" y="-14" fill="#ffffff" font-family="sans-serif" font-size="9" text-anchor="middle">Node A (₹4.2L)</text>
        </g>

        <g transform="translate(270, 90)">
          <circle cx="0" cy="0" r="10" fill="#f59e0b"/>
          <text x="0" y="-14" fill="#ffffff" font-family="sans-serif" font-size="9" text-anchor="middle">Node B (₹3.8L)</text>
        </g>

        <g transform="translate(80, 280)">
          <circle cx="0" cy="0" r="10" fill="#38bdf8"/>
          <text x="0" y="22" fill="#ffffff" font-family="sans-serif" font-size="9" text-anchor="middle">Node C (Pass-thru)</text>
        </g>

        <g transform="translate(290, 270)">
          <circle cx="0" cy="0" r="10" fill="#38bdf8"/>
          <text x="0" y="22" fill="#ffffff" font-family="sans-serif" font-size="9" text-anchor="middle">Node D (Pass-thru)</text>
        </g>

        <g transform="translate(185, 350)">
          <circle cx="0" cy="0" r="12" fill="#ff4757"/>
          <text x="0" y="24" fill="#ff6b81" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">Cash-out ATM (Delhi)</text>
        </g>
      </g>
    </g>

    <!-- Column 3: AI Model Governance & Rules Matrix -->
    <g transform="translate(800, 0)">
      <rect x="0" y="0" width="320" height="530" rx="16" fill="url(#adCard)" stroke="#ffffff" stroke-opacity="0.1" filter="url(#adShadow)"/>
      <text x="20" y="34" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800">Dynamic Thresholds</text>
      <text x="20" y="54" fill="#64748b" font-family="sans-serif" font-size="11">Real-time ML sensitivity knobs</text>

      <g transform="translate(20, 80)">
        <!-- Slider 1 -->
        <text x="0" y="16" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Travel Velocity Max Limit</text>
        <text x="280" y="16" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">850 km/h</text>
        <rect x="0" y="26" width="280" height="6" rx="3" fill="#1e293b"/>
        <rect x="0" y="26" width="180" height="6" rx="3" fill="#38bdf8"/>

        <!-- Slider 2 -->
        <text x="0" y="70" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Auto-Freeze Confidence</text>
        <text x="280" y="70" fill="#ff4757" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">92%</text>
        <rect x="0" y="80" width="280" height="6" rx="3" fill="#1e293b"/>
        <rect x="0" y="80" width="240" height="6" rx="3" fill="#ff4757"/>

        <!-- Slider 3 -->
        <text x="0" y="124" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">SIM Swap Lockout Window</text>
        <text x="280" y="124" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">24 Hours</text>
        <rect x="0" y="134" width="280" height="6" rx="3" fill="#1e293b"/>
        <rect x="0" y="134" width="140" height="6" rx="3" fill="#f59e0b"/>

        <!-- Slider 4 -->
        <text x="0" y="178" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Mule Graph Depth Scan</text>
        <text x="280" y="178" fill="#10b981" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">4 Hops</text>
        <rect x="0" y="188" width="280" height="6" rx="3" fill="#1e293b"/>
        <rect x="0" y="188" width="200" height="6" rx="3" fill="#10b981"/>
      </g>

      <!-- Bottom System Audit Box -->
      <g transform="translate(20, 360)">
        <rect x="0" y="0" width="280" height="130" rx="12" fill="#091427" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="14" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">COMPLIANCE & AUDIT LOG</text>
        <text x="14" y="48" fill="#ffffff" font-family="sans-serif" font-size="11">✓ Cert-In Incident Reporting API v2</text>
        <text x="14" y="70" fill="#ffffff" font-family="sans-serif" font-size="11">✓ RBI Master Direction 2026/04</text>
        <text x="14" y="92" fill="#ffffff" font-family="sans-serif" font-size="11">✓ Real Google Maps Geospatial</text>
        <text x="14" y="114" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">Tamper-Proof SHA-256 Ledger</text>
      </g>
    </g>
  </g>
</svg>
