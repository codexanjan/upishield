      <text x="16" y="28" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">বাংলা</text>
      <text x="16" y="46" fill="#88A5A2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Bengali · Kolkata Region</text>
