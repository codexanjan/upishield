<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="260" rx="16" fill="#071216" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <text x="30" y="38" fill="#B8F55E" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
