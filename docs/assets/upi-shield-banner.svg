<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050C0F"/>
      <stop offset="50%" stop-color="#081418"/>
      <stop offset="100%" stop-color="#061215"/>
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonLimeCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#B8F55E"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0" y1="0" x2="200" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B8F55E"/>
      <stop offset="60%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(184, 245, 94, 0.04)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="rgba(6, 182, 212, 0.15)"/>
    </pattern>
  </defs>

  <!-- Deep Cyber Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#techGrid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="210" r="140" fill="#10B981" opacity="0.08" filter="url(#glowFilter)"/>
  <circle cx="1050" cy="200" r="180" fill="#06B6D4" opacity="0.08" filter="url(#glowFilter)"/>
  <circle cx="600" cy="40" r="160" fill="#B8F55E" opacity="0.05" filter="url(#glowFilter)"/>

  <!-- Geometric Shield Emblem on Left -->
  <g transform="translate(80, 85)">
    <!-- Outer Shield Halo -->
    <path d="M120 15L210 50V125C210 185 120 235 120 235C120 235 30 185 30 125V50L120 15Z" 
          fill="none" stroke="url(#neonLimeCyan)" stroke-width="2" stroke-dasharray="6 8" opacity="0.4"/>

    <!-- Inner Core Shield -->
    <path d="M120 25L195 56V120C195 170 120 215 120 215C120 215 45 170 45 120V56L120 25Z" 
          fill="rgba(6, 182, 212, 0.06)" stroke="url(#shieldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dual Payment Trajectory Chevrons -->
    <path d="M95 110L120 85L145 110" stroke="#B8F55E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M145 135L120 160L95 135" stroke="#06B6D4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Central Micro-Pulse Core -->
    <circle cx="120" cy="122.5" r="9" fill="#FFFFFF" filter="url(#glowFilter)"/>
  </g>

  <!-- Typography &amp; Brand Title -->
  <g transform="translate(340, 110)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="310" height="28" rx="14" fill="rgba(184, 245, 94, 0.1)" stroke="rgba(184, 245, 94, 0.3)" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#B8F55E"/>
    <text x="30" y="18" fill="#B8F55E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">
      AUTONOMOUS PAYMENT INTELLIGENCE
    </text>

    <!-- Main Title -->
    <text x="0" y="78" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
      UPI SHIELD <tspan fill="#B8F55E">AI</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="116" fill="#88A5A2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
      Next-Gen Financial Defense System with Deterministic Guardrails &amp; Explainable AI (XAI)
    </text>

    <!-- Key Feature Badges Grid -->
    <g transform="translate(0, 150)">
      <!-- Badge 1: 8 Indian Languages -->
      <rect x="0" y="0" width="180" height="38" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="14" y="24" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
        🌐 8 Indian Languages
      </text>

      <!-- Badge 2: Dual Portals -->
      <rect x="195" y="0" width="165" height="38" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="210" y="24" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
        🛡️ User &amp; Admin Desks
      </text>

      <!-- Badge 3: Explainable AI -->
      <rect x="375" y="0" width="170" height="38" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="390" y="24" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
        ⚡ Explainable AI (XAI)
      </text>

      <!-- Badge 4: Real Map Intelligence -->
      <rect x="560" y="0" width="185" height="38" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="575" y="24" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
        📍 Geospatial Radar
      </text>
    </g>

    <!-- Bottom Metrics Strip -->
    <g transform="translate(0, 215)">
      <text x="0" y="20" fill="#587470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">
        LATENCY: &lt;14MS · ZERO-AI DETERMINISTIC SAFETY · END-TO-END IMMUTABLE AUDIT TRAIL · 84 PRERENDERED ROUTES
      </text>
    </g>
  </g>

  <!-- Accent Status Bar on Bottom -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#neonLimeCyan)"/>
</svg>
