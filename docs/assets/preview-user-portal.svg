      <!-- Factor 1 -->
      <text x="0" y="16" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Geographic Travel Velocity</text>
      <text x="480" y="16" fill="#ff4757" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="end">+42% Risk</text>
      <rect x="0" y="26" width="480" height="8" rx="4" fill="#142e34"/>
