      <circle cx="32" cy="32" r="16" fill="#b8f55e" fill-opacity="0.15"/>
      <text x="32" y="37" fill="#b8f55e" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">✓</text>
      <text x="60" y="26" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Star Cafe (Koramangala)</text>
      <text x="60" y="46" fill="#8fa9a6" font-family="sans-serif" font-size="11">Bengaluru · Verified POS</text>
      <text x="354" y="36" fill="#ffffff" font-family="monospace" font-size="15" font-weight="700" text-anchor="end">₹850</text>
    </g>

    <!-- Txn 2 -->
    <g transform="translate(24, 160)">
      <rect x="0" y="0" width="372" height="65" rx="12" fill="#07191e" stroke="#ffffff" stroke-opacity="0.06"/>
      <circle cx="32" cy="32" r="16" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="32" y="37" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">✓</text>
      <text x="60" y="26" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Nature's Basket (Indiranagar)</text>
      <text x="60" y="46" fill="#8fa9a6" font-family="sans-serif" font-size="11">Bengaluru · HDFC Gateway</text>
      <text x="354" y="36" fill="#ffffff" font-family="monospace" font-size="15" font-weight="700" text-anchor="end">₹2,100</text>
    </g>

    <!-- Txn 3 (Flagged) -->
    <g transform="translate(24, 235)">
      <rect x="0" y="0" width="372" height="65" rx="12" fill="#2d0a11" stroke="#ff4757" stroke-opacity="0.3"/>
      <circle cx="32" cy="32" r="16" fill="#ff4757" fill-opacity="0.25"/>
      <text x="32" y="37" fill="#ff4757" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">!</text>
      <text x="60" y="26" fill="#ff6b81" font-family="sans-serif" font-size="13" font-weight="800">Unknown Tech Support</text>
      <text x="60" y="46" fill="#ffffff" font-family="sans-serif" font-size="11">Delhi Rohini · Quarantined</text>
      <text x="354" y="36" fill="#ff4757" font-family="monospace" font-size="15" font-weight="800" text-anchor="end">₹18,500</text>
    </g>

    <!-- View All Link -->
    <g transform="translate(24, 325)">
      <rect x="0" y="0" width="372" height="45" rx="12" fill="#b8f55e"/>
      <text x="186" y="28" fill="#041215" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">Open Full Geofenced Payment Map →</text>
    </g>
  </g>
</svg>
