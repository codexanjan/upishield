      <text x="480" y="76" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="end">+28% Risk</text>
      <rect x="0" y="86" width="480" height="8" rx="4" fill="#142e34"/>
      <rect x="0" y="86" width="260" height="8" rx="4" fill="#f59e0b"/>

      <!-- Factor 3 -->
      <text x="0" y="136" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">VPA Behavioral History & Age</text>
      <text x="480" y="136" fill="#b8f55e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="end">-35% Safety</text>
      <rect x="0" y="146" width="480" height="8" rx="4" fill="#142e34"/>
      <rect x="0" y="146" width="310" height="8" rx="4" fill="#b8f55e"/>

      <!-- Factor 4 -->
      <text x="0" y="196" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Biometric & SIM Binding Integrity</text>
      <text x="480" y="196" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="end">Hardware Pass</text>
      <rect x="0" y="206" width="480" height="8" rx="4" fill="#142e34"/>
      <rect x="0" y="206" width="450" height="8" rx="4" fill="#38bdf8"/>
    </g>

    <!-- Bottom Shield Badge -->
    <g transform="translate(30, 335)">
      <rect x="0" y="0" width="620" height="50" rx="12" fill="#06161b" stroke="#b8f55e" stroke-opacity="0.3"/>
      <text x="20" y="30" fill="#b8f55e" font-family="sans-serif" font-size="12" font-weight="700">🔒 NPCI Zero-Trust Framework Compliant · On-Device Geolocation Quarantine</text>
