<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="upBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051014"/>
      <stop offset="50%" stop-color="#081c22"/>
      <stop offset="100%" stop-color="#0a2730"/>
    </linearGradient>
    <linearGradient id="upCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f262d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#08181d" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8f55e"/>
      <stop offset="100%" stop-color="#84f039"/>
    </linearGradient>
    <filter id="upShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#upBg)"/>

  <!-- Header -->
  <g transform="translate(40, 30)">
    <circle cx="16" cy="16" r="16" fill="#b8f55e" fill-opacity="0.2"/>
    <path d="M 16 6 L 25 11 L 25 20 C 25 25 16 29 16 29 C 16 29 7 25 7 20 L 7 11 Z" fill="#b8f55e"/>
    <text x="42" y="22" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="900" font-size="20">UPI SHIELD <tspan fill="#b8f55e">USER PORTAL</tspan></text>
    
    <!-- Language Switcher Pill -->
    <g transform="translate(860, 0)">
      <rect x="0" y="0" width="260" height="36" rx="18" fill="#0d242a" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="18" y="23" fill="#b8f55e" font-family="sans-serif" font-size="12" font-weight="700">🌐 8 Indian Languages: ಕನ್ನಡ (Kannada)</text>
    </g>
  </g>

  <!-- Metric KPI Cards Row -->
  <g transform="translate(40, 90)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="260" height="110" rx="16" fill="url(#upCard)" stroke="#ffffff" stroke-opacity="0.1" filter="url(#upShadow)"/>
    <text x="20" y="32" fill="#8fa9a6" font-family="sans-serif" font-size="12" font-weight="600">Active Balance Guard</text>
    <text x="20" y="70" fill="#ffffff" font-family="monospace" font-size="28" font-weight="800">₹84,250</text>
    <text x="20" y="92" fill="#b8f55e" font-family="sans-serif" font-size="11" font-weight="600">✓ 3 Bank Accounts Protected</text>

    <!-- KPI 2 -->
    <rect x="286" y="0" width="260" height="110" rx="16" fill="url(#upCard)" stroke="#ffffff" stroke-opacity="0.1" filter="url(#upShadow)"/>
    <text x="306" y="32" fill="#8fa9a6" font-family="sans-serif" font-size="12" font-weight="600">Personal Safety Score</text>
    <text x="306" y="70" fill="#b8f55e" font-family="monospace" font-size="28" font-weight="800">96 / 100</text>
    <text x="306" y="92" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">Excellent • 0 Critical Exposures</text>

    <!-- KPI 3 -->
    <rect x="572" y="0" width="260" height="110" rx="16" fill="url(#upCard)" stroke="#ffffff" stroke-opacity="0.1" filter="url(#upShadow)"/>
    <text x="592" y="32" fill="#8fa9a6" font-family="sans-serif" font-size="12" font-weight="600">Geofence Status</text>
    <text x="592" y="70" fill="#ffffff" font-family="monospace" font-size="24" font-weight="800">Bengaluru HQ</text>
    <text x="592" y="92" fill="#b8f55e" font-family="sans-serif" font-size="11" font-weight="600">Radius: 25 km • Zero silent leakage</text>

    <!-- KPI 4 -->
    <rect x="858" y="0" width="262" height="110" rx="16" fill="url(#upCard)" stroke="#ffffff" stroke-opacity="0.1" filter="url(#upShadow)"/>
    <text x="878" y="32" fill="#8fa9a6" font-family="sans-serif" font-size="12" font-weight="600">Blocked Scams</text>
    <text x="878" y="70" fill="#ff4757" font-family="monospace" font-size="28" font-weight="800">7 Intercepted</text>
    <text x="878" y="92" fill="#ff6b81" font-family="sans-serif" font-size="11" font-weight="600">₹32,900 saved from QR traps</text>
  </g>

