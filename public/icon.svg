<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGradLarge" x1="20" y1="20" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#B8F55E" />
    </linearGradient>
    <filter id="coreGlow" x="40" y="40" width="100" height="100" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="180" height="180" rx="42" fill="#071014" stroke="rgba(255,255,255,0.15)" stroke-width="4" />
  
  <!-- Outer Tech Contour -->
  <circle cx="90" cy="90" r="72" stroke="rgba(184, 245, 94, 0.15)" stroke-width="1.5" stroke-dasharray="4 6" />

  <!-- Geometric Shield -->
  <path d="M90 36L135 55V90C135 118 90 144 90 144C90 144 45 118 45 90V55L90 36Z"
        fill="rgba(6, 182, 212, 0.08)" stroke="url(#shieldGradLarge)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Dual UPI Flow Chevrons -->
  <path d="M74 82L90 66L106 82" stroke="#B8F55E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M106 98L90 114L74 98" stroke="#06B6D4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Core AI Pulse -->
  <circle cx="90" cy="90" r="8" fill="#FFFFFF" filter="url(#coreGlow)" />
</svg>
